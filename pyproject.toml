[project]
name = "notes-api"
version = "0.1.0"
description = "API REST de notas personales con FastAPI y MySQL"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "C4", "PT", "RUF"]

[tool.ruff.lint.isort]
# El directorio local alembic/ no debe confundirse con el paquete instalado.
known-third-party = ["alembic"]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# FastAPI usa Depends()/Query() en los valores por defecto de los parámetros.
"app/routers/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
